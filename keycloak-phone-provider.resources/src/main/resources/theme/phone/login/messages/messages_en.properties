protocolsPolicyTermsContent=<p class="policy-text">By accessing or using this website, you agree to be bound by these Terms of Service.</p><h3 class="policy-heading">Eligibility</h3><p class="policy-text"><strong>You must be of legal age in your jurisdiction to register and participate.</strong></p><h3 class="policy-heading">Use of Website</h3><p class="policy-text">You agree not to misuse this website or engage in unlawful activity. You must provide accurate information when registering.</p><h3 class="policy-heading">Event Participation</h3><p class="policy-text">We reserve the right to modify, postpone, or cancel the event.</p><h3 class="policy-heading">Intellectual Property</h3><p class="policy-text">All content on this website, including logos, text, and media, is protected by intellectual property rights and may not be used without authorization.</p><h3 class="policy-heading">Disclaimer and Limitation of Liability</h3><p class="policy-text">The website and event are provided as is. To the maximum extent permitted by law, we disclaim all liability for damages arising from your use of the website or participation in the event.</p><h3 class="policy-heading">Governing Law</h3><p class="policy-text">These Terms shall be governed by and construed in accordance with the laws of the United States, except as otherwise required by applicable law.</p>
protocolsPolicyPrivacyContent=<p class="policy-text">This Privacy Policy describes how we collect, use, and disclose information in connection with your use of this website.</p><h3 class="policy-heading">Information We Collect</h3><p class="policy-text">We may collect:</p><ul class="policy-list"><li>Personal information you provide, such as your name, email address, and other registration details.</li><li>Technical data, including IP address, browser type, and site usage information.</li></ul><h3 class="policy-heading">Use of Information</h3><p class="policy-text">We use your information to:</p><ul class="policy-list"><li>Process event registrations and communications.</li><li>Improve the functionality and security of our website.</li><li>Comply with legal and regulatory obligations.</li></ul><h3 class="policy-heading">Disclosure of Information</h3><p class="policy-text">We do not sell personal data. Information may be disclosed to service providers acting on our behalf, or where required by law.</p><h3 class="policy-heading">Data Retention and Security</h3><p class="policy-text">We retain your information only as long as necessary for event purposes and take reasonable measures to safeguard it.</p><h3 class="policy-heading">Your Rights</h3><p class="policy-text">You may request access to, correction of, or deletion of your personal data. Contact us at <a href="mailto:dev@funcity.org" class="policy-link">dev@funcity.org</a> for such requests.</p>
protocolsPolicyCookieContent=<p class="policy-text">This Cookie Policy explains how cookies are used on this website.</p><h3 class="policy-heading">What Are Cookies</h3><p class="policy-text">Cookies are small text files stored on your device when you visit our website.</p><h3 class="policy-heading">Types of Cookies We Use</h3><ul class="policy-list"><li><strong>Strictly Necessary Cookies:</strong> Essential for website operation and registration functions.</li><li><strong>Performance and Analytics Cookies:</strong> Collect data on usage to help us improve services.</li><li><strong>Preference Cookies:</strong> Store user settings and preferences.</li></ul><h3 class="policy-heading">Third-Party Cookies</h3><p class="policy-text">We may use third-party services (e.g., analytics providers) that set their own cookies.</p><h3 class="policy-heading">Managing Cookies</h3><p class="policy-text">You may disable or restrict cookies through your browser settings. Please note that disabling certain cookies may affect website functionality.</p>


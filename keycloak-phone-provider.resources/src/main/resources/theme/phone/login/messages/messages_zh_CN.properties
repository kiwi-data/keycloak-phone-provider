protocolsPolicyTermsContent=<p class="policy-text">\u901a\u8fc7\u8bbf\u95ee\u6216\u4f7f\u7528\u672c\u7f51\u7ad9\uff0c\u5373\u8868\u793a\u60a8\u540c\u610f\u9075\u5b88\u5e76\u53d7\u672c\u670d\u52a1\u6761\u6b3e\u7ea6\u675f\u3002</p><h3 class="policy-heading">\u8d44\u683c</h3><p class="policy-text"><strong>\u60a8\u5fc5\u987b\u8fbe\u5230\u60a8\u6240\u5728\u53f8\u6cd5\u8f96\u533a\u89c4\u5b9a\u7684\u6cd5\u5b9a\u5e74\u9f84\u65b9\u53ef\u6ce8\u518c\u5e76\u53c2\u4e0e\u3002</strong></p><h3 class="policy-heading">\u7f51\u7ad9\u4f7f\u7528</h3><p class="policy-text">\u60a8\u540c\u610f\u4e0d\u6ee5\u7528\u672c\u7f51\u7ad9\u6216\u4ece\u4e8b\u4efb\u4f55\u8fdd\u6cd5\u6d3b\u52a8\u3002\u6ce8\u518c\u65f6\u5fc5\u987b\u63d0\u4f9b\u51c6\u786e\u7684\u4fe1\u606f\u3002</p><h3 class="policy-heading">\u6d3b\u52a8\u53c2\u4e0e</h3><p class="policy-text">\u6211\u4eec\u4fdd\u7559\u4fee\u6539\u3001\u5ef6\u671f\u6216\u53d6\u6d88\u6d3b\u52a8\u7684\u6743\u5229\u3002</p><h3 class="policy-heading">\u77e5\u8bc6\u4ea7\u6743</h3><p class="policy-text">\u672c\u7f51\u7ad9\u4e0a\u7684\u6240\u6709\u5185\u5bb9\uff0c\u5305\u62ec\u6807\u8bc6\u3001\u6587\u5b57\u548c\u5a92\u4f53\uff0c\u5747\u53d7\u77e5\u8bc6\u4ea7\u6743\u4fdd\u62a4\uff0c\u672a\u7ecf\u6388\u6743\u4e0d\u5f97\u4f7f\u7528\u3002</p><h3 class="policy-heading">\u514d\u8d23\u58f0\u660e\u53ca\u8d23\u4efb\u9650\u5236</h3><p class="policy-text">\u672c\u7f51\u7ad9\u548c\u6d3b\u52a8\u6309\u201c\u73b0\u72b6\u201d\u63d0\u4f9b\u3002\u5728\u6cd5\u5f8b\u5141\u8bb8\u7684\u6700\u5927\u8303\u56f4\u5185\uff0c\u6211\u4eec\u4e0d\u5bf9\u60a8\u4f7f\u7528\u672c\u7f51\u7ad9\u6216\u53c2\u4e0e\u6d3b\u52a8\u6240\u4ea7\u751f\u7684\u4efb\u4f55\u635f\u5bb3\u627f\u62c5\u8d23\u4efb\u3002</p><h3 class="policy-heading">\u9002\u7528\u6cd5\u5f8b</h3><p class="policy-text">\u9664\u9002\u7528\u6cd5\u5f8b\u53e6\u6709\u89c4\u5b9a\u5916\uff0c\u672c\u6761\u6b3e\u53d7\u7f8e\u56fd\u6cd5\u5f8b\u7ba1\u8f96\u5e76\u6309\u5176\u89e3\u91ca\u3002</p>
protocolsPolicyPrivacyContent=<p class="policy-text">\u672c\u9690\u79c1\u653f\u7b56\u8bf4\u660e\u6211\u4eec\u5728\u60a8\u4f7f\u7528\u672c\u7f51\u7ad9\u65f6\u5982\u4f55\u6536\u96c6\u3001\u4f7f\u7528\u548c\u62ab\u9732\u4fe1\u606f\u3002</p><h3 class="policy-heading">\u6211\u4eec\u6536\u96c6\u7684\u4fe1\u606f</h3><p class="policy-text">\u6211\u4eec\u53ef\u80fd\u6536\u96c6\uff1a</p><ul class="policy-list"><li>\u60a8\u63d0\u4f9b\u7684\u4e2a\u4eba\u4fe1\u606f\uff0c\u4f8b\u5982\u59d3\u540d\u3001\u7535\u5b50\u90ae\u7bb1\u5730\u5740\u4ee5\u53ca\u5176\u4ed6\u6ce8\u518c\u4fe1\u606f\u3002</li><li>\u6280\u672f\u6570\u636e\uff0c\u5305\u62ec IP \u5730\u5740\u3001\u6d4f\u89c8\u5668\u7c7b\u578b\u4ee5\u53ca\u7f51\u7ad9\u4f7f\u7528\u60c5\u51b5\u7b49\u4fe1\u606f\u3002</li></ul><h3 class="policy-heading">\u4fe1\u606f\u4f7f\u7528</h3><p class="policy-text">\u6211\u4eec\u4f7f\u7528\u60a8\u7684\u4fe1\u606f\u4ee5\uff1a</p><ul class="policy-list"><li>\u5904\u7406\u6d3b\u52a8\u6ce8\u518c\u548c\u76f8\u5173\u6c9f\u901a\u3002</li><li>\u63d0\u5347\u7f51\u7ad9\u7684\u529f\u80fd\u4e0e\u5b89\u5168\u6027\u3002</li><li>\u5c65\u884c\u6cd5\u5f8b\u548c\u76d1\u7ba1\u4e49\u52a1\u3002</li></ul><h3 class="policy-heading">\u4fe1\u606f\u62ab\u9732</h3><p class="policy-text">\u6211\u4eec\u4e0d\u4f1a\u51fa\u552e\u4e2a\u4eba\u6570\u636e\u3002\u6211\u4eec\u53ef\u80fd\u5411\u4ee3\u8868\u6211\u4eec\u63d0\u4f9b\u670d\u52a1\u7684\u670d\u52a1\u5546\u62ab\u9732\u4fe1\u606f\uff0c\u6216\u5728\u6cd5\u5f8b\u8981\u6c42\u65f6\u62ab\u9732\u3002</p><h3 class="policy-heading">\u6570\u636e\u4fdd\u7559\u4e0e\u5b89\u5168</h3><p class="policy-text">\u6211\u4eec\u4ec5\u5728\u6d3b\u52a8\u76ee\u7684\u6240\u9700\u7684\u671f\u9650\u5185\u4fdd\u7559\u60a8\u7684\u4fe1\u606f\uff0c\u5e76\u91c7\u53d6\u5408\u7406\u63aa\u65bd\u4fdd\u62a4\u5176\u5b89\u5168\u3002</p><h3 class="policy-heading">\u60a8\u7684\u6743\u5229</h3><p class="policy-text">\u60a8\u53ef\u4ee5\u8bf7\u6c42\u8bbf\u95ee\u3001\u66f4\u6b63\u6216\u5220\u9664\u60a8\u7684\u4e2a\u4eba\u6570\u636e\u3002\u5982\u9700\u6b64\u7c7b\u8bf7\u6c42\uff0c\u8bf7\u8054\u7cfb <a href="mailto:dev@funcity.org" class="policy-link">dev@funcity.org</a>\u3002</p>
protocolsPolicyCookieContent=<p class="policy-text">\u672c Cookie \u653f\u7b56\u8bf4\u660e\u672c\u7f51\u7ad9\u5982\u4f55\u4f7f\u7528 Cookie\u3002</p><h3 class="policy-heading">\u4ec0\u4e48\u662f Cookie</h3><p class="policy-text">Cookie \u662f\u60a8\u8bbf\u95ee\u672c\u7f51\u7ad9\u65f6\u5b58\u50a8\u5728\u8bbe\u5907\u4e0a\u7684\u5c0f\u578b\u6587\u672c\u6587\u4ef6\u3002</p><h3 class="policy-heading">\u6211\u4eec\u4f7f\u7528\u7684 Cookie \u7c7b\u578b</h3><ul class="policy-list"><li><strong>\u4e25\u683c\u5fc5\u8981\u7684 Cookie\uff1a</strong>\u7528\u4e8e\u7f51\u7ad9\u8fd0\u884c\u548c\u6ce8\u518c\u529f\u80fd\u7684\u5fc5\u8981 Cookie\u3002</li><li><strong>\u6027\u80fd\u4e0e\u5206\u6790 Cookie\uff1a</strong>\u6536\u96c6\u4f7f\u7528\u6570\u636e\u4ee5\u5e2e\u52a9\u6211\u4eec\u6539\u8fdb\u670d\u52a1\u3002</li><li><strong>\u504f\u597d Cookie\uff1a</strong>\u4fdd\u5b58\u7528\u6237\u8bbe\u7f6e\u548c\u504f\u597d\u3002</li></ul><h3 class="policy-heading">\u7b2c\u4e09\u65b9 Cookie</h3><p class="policy-text">\u6211\u4eec\u53ef\u80fd\u4f7f\u7528\u7b2c\u4e09\u65b9\u670d\u52a1\uff08\u4f8b\u5982\u5206\u6790\u670d\u52a1\u5546\uff09\uff0c\u5176\u4f1a\u8bbe\u7f6e\u81ea\u5df1\u7684 Cookie\u3002</p><h3 class="policy-heading">\u7ba1\u7406 Cookie</h3><p class="policy-text">\u60a8\u53ef\u4ee5\u901a\u8fc7\u6d4f\u89c8\u5668\u8bbe\u7f6e\u7981\u7528\u6216\u9650\u5236 Cookie\u3002\u8bf7\u6ce8\u610f\uff0c\u7981\u7528\u67d0\u4e9b Cookie \u53ef\u80fd\u4f1a\u5f71\u54cd\u7f51\u7ad9\u529f\u80fd\u3002</p>

# 邮箱验证
emailVerificationSubject=验证您的邮箱地址 - {0}
emailVerificationBody=您好，\n\n欢迎加入 {2}！您的账号已创建成功。\n\n请点击下方链接验证您的邮箱地址：\n\n{0}\n\n此链接将在 {3} 后过期。\n\n如果您没有创建此账号，请忽略此邮件。\n\n祝好，\n{2} 团队
emailVerificationBodyHtml=<p>您好，</p><p>欢迎加入 <strong>{2}</strong>！您的账号已创建成功。</p><p>请点击下方按钮验证您的邮箱地址：</p><p><a href="{0}" style="display:inline-block;padding:12px 24px;background-color:#0066cc;color:#ffffff;text-decoration:none;border-radius:4px;font-weight:bold;">验证邮箱地址</a></p><p>或复制以下链接到浏览器中打开：</p><p><a href="{0}">{0}</a></p><p>此链接将在 {3} 后过期。</p><p>如果您没有创建此账号，请忽略此邮件。</p><p>祝好，<br/>{2} 团队</p>

# 密码重置
passwordResetSubject=重置您的密码 - {0}
passwordResetBody=您好，\n\n我们收到了重置您 {2} 账号密码的请求。\n\n请点击下方链接重置您的密码：\n\n{0}\n\n此链接将在 {3} 后过期。\n\n如果您没有请求重置密码，请忽略此邮件，您的密码将保持不变。\n\n祝好，\n{2} 团队
passwordResetBodyHtml=<p>您好，</p><p>我们收到了重置您 <strong>{2}</strong> 账号密码的请求。</p><p>请点击下方按钮重置您的密码：</p><p><a href="{0}" style="display:inline-block;padding:12px 24px;background-color:#0066cc;color:#ffffff;text-decoration:none;border-radius:4px;font-weight:bold;">重置密码</a></p><p>或复制以下链接到浏览器中打开：</p><p><a href="{0}">{0}</a></p><p>此链接将在 {3} 后过期。</p><p>如果您没有请求重置密码，请忽略此邮件，您的密码将保持不变。</p><p>祝好，<br/>{2} 团队</p>

